name: Build GitHub Pages

on:
  workflow_call:
    secrets:
      CARTO_BASEMAP_LOG_MASK:
        description: The public repository variable, passed as a secret only for log masking
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Register CARTO log mask
        run: |
          if [ -n "$CARTO_BASEMAP_LOG_MASK" ]; then
            echo "::add-mask::$CARTO_BASEMAP_LOG_MASK"
          fi
        env:
          CARTO_BASEMAP_LOG_MASK: ${{ secrets.CARTO_BASEMAP_LOG_MASK }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build production site
        run: npm run build
        env:
          NEXT_PUBLIC_CARTO_BASEMAP_KEY: ${{ vars.NEXT_PUBLIC_CARTO_BASEMAP_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
