name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Passing the variable as a reusable-workflow secret masks it before the
    # runner prints any step environment. No extra repository secret is needed.
    uses: ./.github/workflows/build-pages.yml
    secrets:
      CARTO_BASEMAP_LOG_MASK: ${{ vars.NEXT_PUBLIC_CARTO_BASEMAP_KEY }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
